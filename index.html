<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="data:,">
    <title>MiniTube</title>
</head>
<body style="background:#111; color:#fff; font-family:sans-serif; padding:20px;">

    <h2>MiniTube (أقل من 50MB)</h2>
    <input type="file" id="videoInput" accept="video/*">
    <div id="status" style="margin:10px 0; color:#ff6b00;">جاهز...</div>
    <hr>
    <div id="videoFeed"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js";
        import {
            getFirestore, collection, addDoc, onSnapshot,
            query, orderBy, doc, updateDoc, increment
        } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore.js";

        const CLOUD_NAME = "t3niaerg";
        const UPLOAD_PRESET = "gnhe0akq";

        const firebaseConfig = {
            apiKey: "AIzaSyDoFI_AFh_xZpPIQCIp0mqfaJ_wZDJrUTQ",
            authDomain: "minitube-43b9c.firebaseapp.com",
            projectId: "minitube-43b9c",
            storageBucket: "minitube-43b9c.firebasestorage.app",
            messagingSenderId: "531718212714",
            appId: "1:531718212714:web:569b629c348d36faf5ce13",
            measurementId: "G-TQD9G8DHJL"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const videosRef = collection(db, "videos");

        const MAX_SIZE_BYTES = 50 * 1024 * 1024;
        const videoInput = document.getElementById('videoInput');
        const statusDiv = document.getElementById('status');
        const videoFeed = document.getElementById('videoFeed');

        let likedIds = JSON.parse(localStorage.getItem('minitube_liked_ids')) || [];
        let renderedIds = new Set();

        const q = query(videosRef, orderBy("createdAt", "desc"));
        onSnapshot(q, (snapshot) => {
            const videos = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
            renderVideos(videos);
        }, (err) => {
            statusDiv.innerText = "خطأ Firestore: " + err.message;
        });

        videoInput.addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;

            if (file.size > MAX_SIZE_BYTES) {
                statusDiv.innerText = "مرفوض! أكبر من 50MB.";
                videoInput.value = "";
                return;
            }

            statusDiv.innerText = "جاري الرفع...";
            const formData = new FormData();
            formData.append('file', file);
            formData.append('upload_preset', UPLOAD_PRESET);

            try {
                const res = await fetch(`https://api.cloudinary.com/v1_1/${CLOUD_NAME}/video/upload`, {
                    method: 'POST',
                    body: formData
                });
                const data = await res.json();
                if (!data.secure_url) throw new Error(data.error?.message || "فشل الرفع");

                await addDoc(videosRef, {
                    title: file.name,
                    url: data.secure_url,
                    views: 0,
                    likes: 0,
                    createdAt: Date.now()
                });

                statusDiv.innerText = "تم الرفع بنجاح!";
            } catch (err) {
                statusDiv.innerText = "خطأ: " + err.message;
            }
            videoInput.value = "";
        });

        window.addView = async function(id) {
            await updateDoc(doc(db, "videos", id), { views: increment(1) });
        };

        window.toggleLike = async function(id) {
            const alreadyLiked = likedIds.includes(id);
            if (alreadyLiked) {
                likedIds = likedIds.filter(x => x !== id);
                await updateDoc(doc(db, "videos", id), { likes: increment(-1) });
            } else {
                likedIds.push(id);
                await updateDoc(doc(db, "videos", id), { likes: increment(1) });
            }
            localStorage.setItem('minitube_liked_ids', JSON.stringify(likedIds));
        };

        function renderVideos(videos) {
            videos.forEach(v => {
                const isLiked = likedIds.includes(v.id);
                let box = document.getElementById(`box-${v.id}`);

                if (!box) {
                    box = document.createElement('div');
                    box.id = `box-${v.id}`;
                    box.style.marginBottom = "25px";
                    box.style.padding = "10px";
                    box.style.border = "1px solid #444";

                    const vid = document.createElement('video');
                    vid.controls = true;
                    vid.width = 500;
                    vid.style.maxWidth = "100%";
                    vid.style.display = "block";
                    vid.src = v.url;
                    vid.addEventListener('play', () => window.addView(v.id), { once: true });

                    const titleEl = document.createElement('div');
                    titleEl.style.margin = "8px 0";
                    titleEl.innerText = v.title || "فيديو";

                    const statsEl = document.createElement('div');
                    statsEl.className = "stats";
                    statsEl.innerHTML = `
                        <span class="v-count">مشاهدات: ${v.views || 0}</span> |
                        <button class="l-btn" onclick="toggleLike('${v.id}')">
                            ${isLiked ? 'إلغاء الإعجاب' : 'أعجبني'} (<span class="l-count">${v.likes || 0}</span>)
                        </button> |
                        <a href="${v.url}" target="_blank" style="color:#4da6ff;">فتح الرابط مباشرة</a>
                    `;

                    box.appendChild(vid);
                    box.appendChild(titleEl);
                    box.appendChild(statsEl);
                    videoFeed.prepend(box);
                } else {
                    const vCount = box.querySelector('.v-count');
                    const lCount = box.querySelector('.l-count');
                    const lBtn = box.querySelector('.l-btn');
                    if (vCount) vCount.innerText = `مشاهدات: ${v.views || 0}`;
                    if (lCount) lCount.innerText = v.likes || 0;
                    if (lBtn) lBtn.innerHTML = `${isLiked ? 'إلغاء الإعجاب' : 'أعجبني'} (<span class="l-count">${v.likes || 0}</span>)`;
                }
            });
        }
    </script>
</body>
</html>
